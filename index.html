<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gesture Vocal Enhancer</title>

    <link rel="stylesheet" href="style.css">
 
    <script type="module" src="app.js"></script>
</head>
<body>

    <div class="container">

        <h1>🎤 Gesture Vocal Enhancer</h1>

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <div class="status">
            <p>Gesture: <span id="gesture">NONE</span></p>
            <p>Bass Mode: <span id="bass">OFF</span></p>
        </div>

        <button id="startBtn">
            Start Camera & Microphone
        </button>

    </div>

    app.jsscript>

</body>
</html>
