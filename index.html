<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetpack Runner</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: linear-gradient(to bottom, #1e3c72, #2a5298);
}

#overlay {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 24px;
    font-weight: bold;
    z-index: 100;
}
</style>
</head>

<body>

<div id="overlay">Score: 0 | Coins: 0</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const groundHeight = 120;

let score = 0;
let coinsCollected = 0;
let gameOver = false;
let flying = false;

const gravity = 0.5;
const thrust = -1.2;

const player = {
    x: 120,
    y: canvas.height - groundHeight - 50,
    width: 40,
    height: 50,
    velocity: 0
};

let obstacles = [];
let coins = [];

class Obstacle {
    constructor() {
        this.gap = 220;

        const gapY =
            Math.random() *
            (canvas.height - groundHeight - this.gap - 100)
            + 50;

        this.x = canvas.width;
        this.width = 80;

        this.topHeight = gapY;

        this.bottomY = gapY + this.gap;

        this.bottomHeight =
            canvas.height -
            groundHeight -
            this.bottomY;

        this.speed = 6;
        this.scored = false;
    }

    update() {
        this.x -= this.speed;
    }

    draw() {
        ctx.fillStyle = "#1abc9c";

        ctx.fillRect(
            this.x,
            0,
            this.width,
            this.topHeight
        );

        ctx.fillRect(
            this.x,
            this.bottomY,
            this.width,
            this.bottomHeight
        );
    }
}

class Coin {
    constructor() {
        this.x = canvas.width;

        this.y =
            Math.random() *
            (canvas.height - groundHeight - 250)
            + 50;

        this.radius = 12;
        this.speed = 6;
        this.collected = false;
    }

    update() {
        this.x -= this.speed;
    }

    draw() {
        ctx.fillStyle = "gold";

        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.strokeStyle = "#ffcc00";
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

function drawGround() {
    ctx.fillStyle = "#444";

    ctx.fillRect(
        0,
        canvas.height - groundHeight,
        canvas.width,
        groundHeight
    );

    ctx.fillStyle = "#666";

    for (let i = 0; i < canvas.width; i += 50) {
        ctx.fillRect(
            i,
            canvas.height - groundHeight,
            25,
            5
        );
    }
}

function drawPlayer() {

    ctx.fillStyle = "#ffd166";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle = "#333";

    ctx.fillRect(
        player.x + 25,
        player.y + 10,
        8,
        8
    );

    if (flying) {

        ctx.fillStyle = "orange";

        ctx.beginPath();
        ctx.moveTo(
            player.x,
            player.y + 15
        );

        ctx.lineTo(
            player.x - 25,
            player.y + 25
        );

        ctx.lineTo(
            player.x,
            player.y + 35
        );

        ctx.fill();
    }
}
