<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetpack Runner</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #111;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(#1e3c72, #2a5298);
    }

    #overlay {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div id="overlay">Score: 0</div>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreElement = document.getElementById("overlay");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let gameOver = false;

const player = {
    x: 120,
    y: canvas.height / 2,
    width: 40,
    height: 40,
    velocity: 0
};

const gravity = 0.5;
const thrust = -1.2;

let flying = false;
let obstacles = [];

class Obstacle {
    constructor() {
        this.gap = 220;

        const gapY =
            Math.random() * (canvas.height - this.gap - 200) + 100;

        this.x = canvas.width;
        this.width = 80;

        this.topHeight = gapY;
        this.bottomY = gapY + this.gap;
        this.bottomHeight = canvas.height - this.bottomY;

        this.speed = 6;
        this.scored = false;
    }

    update() {
        this.x -= this.speed;
    }

    draw() {
        ctx.fillStyle = "#1abc9c";

        ctx.fillRect(
            this.x,
            0,
            this.width,
            this.topHeight
        );

        ctx.fillRect(
            this.x,
            this.bottomY,
            this.width,
            this.bottomHeight
        );
    }
}

function spawnObstacle() {
    obstacles.push(new Obstacle());
}

setInterval(() => {
    if (!gameOver) spawnObstacle();
}, 1800);

function drawPlayer() {
    ctx.fillStyle = "#ffd166";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    // Jet flame
    if (flying) {
        ctx.fillStyle = "orange";

        ctx.beginPath();
        ctx.moveTo(player.x, player.y + 10);
        ctx.lineTo(player.x - 20, player.y + 20);
        ctx.lineTo(player.x, player.y + 30);
        ctx.fill();
    }
}

function updatePlayer() {
    if (flying) {
        player.velocity += thrust;
    }

    player.velocity += gravity;
    player.y += player.velocity;

    if (player.y < 0) {
        player.y = 0;
        player.velocity = 0;
    }

    if (
        player.y + player.height >= canvas.height
    ) {
        endGame();
    }
}

function checkCollision(obs) {
    const hitTop =
        player.x < obs.x + obs.width &&
        player.x + player.width > obs.x &&
        player.y < obs.topHeight;

    const hitBottom =
        player.x < obs.x + obs.width &&
        player.x + player.width > obs.x &&
        player.y + player.height > obs.bottomY;

    return hitTop || hitBottom;
}

function drawBackground() {
    for (let i = 0; i < 50; i++) {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillRect(
            (i * 200 - (score * 2) % 200),
            (i * 37) % canvas.height,
            3,
            3
        );
    }
}

function endGame() {
    gameOver = true;
}

function restartGame() {
    score = 0;
    gameOver = false;

    player.y = canvas.height / 2;
    player.velocity = 0;

    obstacles = [];
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();

    if (!gameOver) {
        updatePlayer();

        obstacles.forEach((obs, index) => {
            obs.update();
            obs.draw();

            if (checkCollision(obs)) {
                endGame();
            }

            if (
                !obs.scored &&
                obs.x + obs.width < player.x
            ) {
                obs.scored = true;
                score++;
            }

            if (obs.x + obs.width < 0) {
                obstacles.splice(index, 1);
            }
        });

        drawPlayer();

        scoreElement.textContent = `Score: ${score}`;
    } else {
        drawPlayer();

        ctx.fillStyle = "white";
        ctx.font = "60px Arial";
        ctx.textAlign = "center";
        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            canvas.height / 2
        );

        ctx.font = "28px Arial";
        ctx.fillText(
            "Press R to Restart",
            canvas.width / 2,
            canvas.height / 2 + 60
        );
    }

    requestAnimationFrame(gameLoop);
}

window.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
        flying = true;
    }

    if (e.key.toLowerCase() === "r" && gameOver) {
        restartGame();
    }
});

window.addEventListener("keyup", (e) => {
    if (e.code === "Space") {
        flying = false;
    }
});

window.addEventListener("mousedown", () => {
    flying = true;
});

window.addEventListener("mouseup", () => {
    flying = false;
});

window.addEventListener("touchstart", () => {
    flying = true;
});

window.addEventListener("touchend", () => {
    flying = false;
});

gameLoop();
</script>

</body>
</html>
